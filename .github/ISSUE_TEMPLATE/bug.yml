name: Bug
description: Algo no site ou na API não funciona como deveria.
labels: [bug]
body:
  - type: textarea
    id: problema
    attributes:
      label: O que acontece
      description: Descreva o erro e onde ele aparece.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra /showroom/new
        2. Responda ...
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Onde
      options:
        - Produção (Render)
        - Local (bun run dev)
        - Os dois
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Prints ou mensagens de erro
      description: Cole aqui o console do navegador, o log do terminal ou um print.
