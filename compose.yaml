services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in Komodo or .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1},backend"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nexus-frontend.rihosting.com.br}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://nexus-frontend.rihosting.com.br}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-Lax}
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexus:nexus@pgrust:5432/nexus}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      CREATE_SUPERUSER_USERNAME: ${CREATE_SUPERUSER_USERNAME:-}
      CREATE_SUPERUSER_EMAIL: ${CREATE_SUPERUSER_EMAIL:-}
      CREATE_SUPERUSER_PASSWORD: ${CREATE_SUPERUSER_PASSWORD:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      PORT: "8000"
    networks:
      - caddy
      - postgres-net
    labels:
      caddy: nexus-backend.rihosting.com.br
      caddy.reverse_proxy: "{{upstreams 8000}}"
    # ports:
    #   - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        WAKU_PUBLIC_BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    container_name: nexus-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      WAKU_PUBLIC_BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    networks:
      - caddy
    labels:
      caddy: nexus-frontend.rihosting.com.br
      caddy.reverse_proxy: "{{upstreams 3000}}"
    # ports:
    #   - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
networks:
  postgres-net:
    external: true
  caddy:
    external: true
