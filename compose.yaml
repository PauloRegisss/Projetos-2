services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-Lax}
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexus:nexus@db:5432/nexus}
      PORT: "8000"
    networks:
      - caddy
      - postgres-net
    labels:
      caddy: nexus-backend.rihosting.com.br
      caddy.reverse_proxy: "{{upstreams 8000}}"
    # ports:
    #   - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        WAKU_PUBLIC_BACKEND_URL: ${WAKU_PUBLIC_BACKEND_URL:-https://nexus-backend.rihosting.com.br}}
    container_name: nexus-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      WAKU_PUBLIC_BACKEND_URL: ${WAKU_PUBLIC_BACKEND_URL:-https://nexus-backend.rihosting.com.br}
    networks:
      - caddy
    labels:
        caddy: nexus-frontend.rihosting.com.br
        caddy.reverse_proxy: "{{upstreams 3000}}"
    # ports:
    #   - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
networks:
  postgres-net:
    external: true
  caddy:
    external: true
